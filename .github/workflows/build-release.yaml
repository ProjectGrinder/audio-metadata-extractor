name: Build-Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to create (e.g., 1.0.0)'
        required: true
        type: string
      dry_run:
        description: 'dry-run: true will skip publishing to GitHub Releases'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # =========================================================================
  # STAGE 1: BUILD MATRIX (PARALLEL WORKERS)
  # =========================================================================
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win64

          - os: ubuntu-latest
            target: linux64

          - os: ubuntu-latest
            target: linux-arm64

          - os: macos-latest
            target: macos-universal

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Ninja & CMake
        uses: lukka/get-cmake@latest

      - name: Install ARM64 GNU Cross Toolchain
        if: matrix.target == 'linux-arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Execute Build Script
        run: python build.py ${{ matrix.target }}

      - name: Upload Binary Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: |
            bin/godot/*
            bin/native/*

  # =========================================================================
  # STAGE 2: PACK PARALLEL JOBS
  # =========================================================================
  pack-godot:
    name: Pack Godot GDExtension
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download All Platform Artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts

      - name: Assemble Godot Package
        run: |
          mkdir -p binding/godot/addons/audio_metadata_extension/bin
          
          # STRICT SEARCH: Copy ONLY from bin/godot outputs!
          find downloaded-artifacts/ -type f \( -path "*/godot/*" -o -path "*/godot" \) \( -name "*.dll" -o -name "*.so" -o -name "*.dylib" \) -exec cp {} binding/godot/addons/audio_metadata_extension/bin/ \;
          
          cd binding/godot
          zip -r ../../audio_metadata_extension_godot_v${{ inputs.tag }}.zip addons/
          cd ../..

      - name: Upload Godot Archive
        uses: actions/upload-artifact@v4
        with:
          name: archive-godot
          path: audio_metadata_extension_godot_v${{ inputs.tag }}.zip

  pack-native:
      name: Pack Native C-ABI FFI
      needs: build
      runs-on: ubuntu-latest
      steps:
        - name: Checkout Repository
          uses: actions/checkout@v4

        - name: Download All Platform Artifacts
          uses: actions/download-artifact@v4
          with:
            path: downloaded-artifacts

        - name: Assemble Native Package
          run: |
            mkdir -p native_release/bin
            mkdir -p native_release/include
            
            # Find all native output directories (matching downloaded-artifacts/*/native or downloaded-artifacts/*/*/native)
            find downloaded-artifacts/ -type d -name "native" | while read native_dir; do
              cp -r "$native_dir"/* native_release/bin/ 2>/dev/null || true
            done

            # Copy header file
            cp include/audio_metadata_extension.h native_release/include/ 2>/dev/null || cp binding/native/include/audio_metadata_extension.h native_release/include/ 2>/dev/null || true
            
            cd native_release
            zip -r ../audio_metadata_extension_native_v${{ inputs.tag }}.zip bin/ include/
            cd ..

        - name: Upload Native Archive
          uses: actions/upload-artifact@v4
          with:
            name: archive-native
            path: audio_metadata_extension_native_v${{ inputs.tag }}.zip

  pack-unity:
    name: Pack Unity UPM (.tgz)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download All Platform Artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts

      - name: Assemble Unity UPM Package
        run: |
          mkdir -p binding/unity/Runtime/Plugins/Windows/x86_64
          mkdir -p binding/unity/Runtime/Plugins/Linux/x86_64
          mkdir -p binding/unity/Runtime/Plugins/Linux/arm64
          mkdir -p binding/unity/Runtime/Plugins/macOS

          # STRICT SEARCH: Copy ONLY from native/ builds into Unity Plugins!
          find downloaded-artifacts/binary-win64/ -type f -path "*/native/*" -name "*.dll" -exec cp {} binding/unity/Runtime/Plugins/Windows/x86_64/ \; 2>/dev/null || true
          find downloaded-artifacts/binary-linux64/ -type f -path "*/native/*" -name "*.so" -exec cp {} binding/unity/Runtime/Plugins/Linux/x86_64/ \; 2>/dev/null || true
          find downloaded-artifacts/binary-linux-arm64/ -type f -path "*/native/*" -name "*.so" -exec cp {} binding/unity/Runtime/Plugins/Linux/arm64/ \; 2>/dev/null || true
          find downloaded-artifacts/binary-macos-universal/ -type f -path "*/native/*" -name "*.dylib" -exec cp {} binding/unity/Runtime/Plugins/macOS/ \; 2>/dev/null || true

          cp -f LICENSE.md binding/unity/LICENSE.md 2>/dev/null || cp -f LICENSE binding/unity/LICENSE 2>/dev/null || true
          cp -f README.md binding/unity/README.md 2>/dev/null || true

          # Sync release tag into package.json
          jq '.version = "${{ inputs.tag }}"' binding/unity/package.json > binding/unity/package.json.tmp && mv binding/unity/package.json.tmp binding/unity/package.json

          cd binding/unity
          npm pack
          mv com.takayama.audiometadataextension-*.tgz ../../com.takayama.audiometadataextension-v${{ inputs.tag }}.tgz
          cd ../..

      - name: Upload Unity UPM Archive
        uses: actions/upload-artifact@v4
        with:
          name: archive-unity
          path: com.takayama.audiometadataextension-v${{ inputs.tag }}.tgz

  # =========================================================================
  # STAGE 3: PUBLISH RELEASE TO GITHUB
  # =========================================================================
  release:
    name: Publish GitHub Release
    needs: [pack-godot, pack-native, pack-unity]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Godot Archive
        uses: actions/download-artifact@v4
        with:
          name: archive-godot

      - name: Download Native Archive
        uses: actions/download-artifact@v4
        with:
          name: archive-native

      - name: Download Unity Archive
        uses: actions/download-artifact@v4
        with:
          name: archive-unity

      - name: Create Git Tag in Repository
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ inputs.tag }}" -m "Release v${{ inputs.tag }}" || true
          git push origin "v${{ inputs.tag }}" || true

      - name: Publish GitHub Release
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ inputs.tag }}"
          name: "Release v${{ inputs.tag }}"
          files: |
            audio_metadata_extension_godot_v${{ inputs.tag }}.zip
            audio_metadata_extension_native_v${{ inputs.tag }}.zip
            com.takayama.audiometadataextension-v${{ inputs.tag }}.tgz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
