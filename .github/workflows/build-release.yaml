name: Build-Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to create (e.g., 1.0.0)'
        required: true
        type: string
      dry_run:
        description: 'dry-run: true will skip publishing to GitHub Releases'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win64

          - os: ubuntu-latest
            target: linux64

          - os: ubuntu-latest
            target: linux-arm64

          - os: macos-latest
            target: macos-universal

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Ninja & CMake
        uses: lukka/get-cmake@latest

      - name: Install ARM64 GNU Cross Toolchain
        if: matrix.target == 'linux-arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Execute Build Script
        run: python build.py ${{ matrix.target }}

      - name: Upload Binary Artifacts (Godot & Native)
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: |
            binding/godot/addons/audio_metadata_extension/bin/*
            binding/native/bin/*
            godot/addons/audio_metadata_extension/bin/*

  release:
    name: Assemble Addons & Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download All Platform Artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts

      - name: Assemble Godot GDExtension Package
        run: |
          mkdir -p binding/godot/addons/audio_metadata_extension/bin
          find downloaded-artifacts/ -type f \( -name "*.dll" -o -name "*.so" -o -name "*.dylib" \) -exec cp {} binding/godot/addons/audio_metadata_extension/bin/ \;
          
          # Create Godot release ZIP
          cd binding/godot
          zip -r ../../audio_metadata_extension_godot_v${{ inputs.tag }}.zip addons/
          cd ../..

      - name: Assemble Native FFI C-ABI Package
        run: |
          mkdir -p native_release/bin
          mkdir -p native_release/include
          
          # Copy all platform shared libraries into bin/
          find downloaded-artifacts/ -type f \( -name "*.dll" -o -name "*.so" -o -name "*.dylib" \) -exec cp {} native_release/bin/ \;
          
          # Copy public C header into include/
          cp src/native/audio_metadata_extension.h native_release/include/ 2>/dev/null || cp binding/native/include/audio_metadata_extension.h native_release/include/
          
          echo "=== Native Bundle Structure ==="
          ls -R native_release/
          
          # Create Native C-ABI release ZIP
          cd native_release
          zip -r ../audio_metadata_extension_native_v${{ inputs.tag }}.zip bin/ include/
          cd ..

      - name: Create Git Tag in Repository
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ inputs.tag }}" -m "Release v${{ inputs.tag }}" || true
          git push origin "v${{ inputs.tag }}" || true

      - name: Publish GitHub Release
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ inputs.tag }}"
          name: "Release v${{ inputs.tag }}"
          files: |
            audio_metadata_extension_godot_v${{ inputs.tag }}.zip
            audio_metadata_extension_native_v${{ inputs.tag }}.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
